# Builds the Windows desktop app on a real Windows machine, runs the end-to-end save/load test
# against the packaged app, and uploads the installer and portable .exe as a downloadable artifact.
name: Desktop app (Windows)

on:
  workflow_dispatch:
  pull_request:
    paths: ['desktop/**', 'src/platform/**', 'src/ui/saves.ts', '.github/workflows/desktop.yml']
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install web app dependencies
        run: npm ci --no-audit --no-fund
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci --no-audit --no-fund
      - name: Build installer and portable app
        working-directory: desktop
        run: npm run dist
      - name: Test the packaged app (start, save, load, restart)
        working-directory: desktop
        env:
          NOOSPHERE_EXE: ${{ github.workspace }}\desktop\release\win-unpacked\The Noosphere.exe
        run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: Noosphere-Windows
          path: |
            desktop/release/Noosphere-Setup-*.exe
            desktop/release/Noosphere-*-portable.exe
          if-no-files-found: error
