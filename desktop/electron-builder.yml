# Builds the Windows installer (NSIS) and a portable .exe into desktop/release/.
appId: io.github.toastburned.hiddenhand
productName: The Hidden Hand
copyright: The Hidden Hand
directories:
  output: release
  buildResources: build
files:
  - main.cjs
  - preload.cjs
  - storage.cjs
  - app/index.html
  - package.json
asar: true
win:
  icon: build/icon.png
  target:
    - nsis
    - portable
nsis:
  artifactName: "HiddenHand-Setup-${version}.${ext}"
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: The Hidden Hand
  # Saved worlds live in Documents\The Hidden Hand\Saves, not in the app folder, so uninstalling never deletes them.
  deleteAppDataOnUninstall: false
portable:
  artifactName: "HiddenHand-${version}-portable.exe"
